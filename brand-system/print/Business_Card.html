<!doctype html><html lang="en"><meta charset="utf-8"><title>Cypress Command business card template</title><style>@font-face{font-family:Inter;src:url('../fonts/Inter-400.woff2');font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:#ddd;font-family:Inter,Arial,sans-serif;color:#0A1F16}.side{width:3.75in;height:2.25in;margin:20px;position:relative;overflow:hidden;break-after:page}.front{background:#1E4D3A;display:grid;place-items:center}.front img{width:3in}.back{background:#F3EDE0;padding:.30in .32in}.back h1{font-size:14pt;font-weight:600;line-height:1.1;margin:0 0 .04in}.role{font-size:9.5pt;margin:0}.details{font-size:8.8pt;line-height:1.4;margin:.18in 0 0}.back img{position:absolute;width:.525in;right:.32in;top:.32in}.notes{max-width:680px;font:14px/1.6 Arial;margin:20px}@media print{@page{size:3.75in 2.25in;margin:0}body{background:none}.side{margin:0}.notes{display:none}.side:last-of-type{break-after:auto}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style><body><div class="notes">Two-sided template. Trim: 3.5 x 2 inches. Bleed: 0.125 inch on all sides. Replace bracketed fields before sending to print. The generated PDF has TrimBox and BleedBox set; its colors are sRGB for vendor proofing.</div><section class="side front"><img src="../logos/svg/cc-04c-horizontal-reverse.svg" alt="Cypress Command"></section><section class="side back"><img src="../logos/svg/cc-04c-mark-cypress.svg" alt=""><h1 contenteditable="true">Adam Abdalla</h1><p class="role" contenteditable="true">Owner / Founder</p><p class="details" contenteditable="true">[Email]<br>[Phone]<br>cypresscommand.com</p></section></body></html>
